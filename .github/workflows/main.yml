name: CI-DockerBuild

on: 
  push:
    branches: ["main"]
  workflow_dispatch:
jobs:
  build:
    # El tipo de máquina virtual donde se ejecutará el job
    runs-on: ubuntu-latest

    # Los pasos que componen el job
    steps:
      # 1. Clona tu repositorio en la máquina virtual
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME  }}
          password: ${{ secrets.DOCKERHUB_TOKEN  }}

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.12.0

      - name: Deploy files
        run: |
          echo ${{ secrets.DOCKERHUB_TOKEN }} | helm registry login registry-1.docker.io -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
          sed -i "s|{{ version }}|${{ github.run_number }}|g" ./mi-chart/Chart.yaml
          cat ./mi-chart/Chart.yaml
          helm package ./mi-chart
 
          helm push ./mi-chart-${{ github.run_number }}.tgz oci://registry-1.docker.io/adonispaz9506
 